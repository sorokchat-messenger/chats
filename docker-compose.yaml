name: sorokchat
services:
  chats:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}
    container_name: sorokchat.chats
    env_file: .env.production.local
    networks:
      - sorokchat
    restart: unless-stopped

networks:
  sorokchat:
    name: sorokchat
  